<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dong-A LUCKY DRAW</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <!-- Pretendard: 기본 UI 글꼴 -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
    <!-- SheetJS: 엑셀 파일 파싱 라이브러리 -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <!-- 최신 Chromium(126+)에서 페이지 간 이동 시 브라우저 네이티브 크로스페이드 전환 -->
    <style>
        @view-transition {
            navigation: auto;
        }
    </style>

    <style>
        /* ── 전역 초기화: 모든 요소의 박스 사이징·여백 통일 ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #0a0b0f;
        }

        body {
            color: var(--text);
            font-family: 'Pretendard', sans-serif;
        }

        /* ── CSS 변수 (디자인 토큰) ── */
        :root {
            --bg:         #111317;              /* 페이지 기본 배경 (매우 어두운 회색) */

            --gold:       #d4af37;              /* 기본 골드 */
            --gold-faint: rgba(212,175,55,.1);  /* 극히 연한 골드 (버튼 배경 틴트) */
            --gold-line:  rgba(212,175,55,.22); /* 반투명 골드 (테두리) */

            --text:       #f2ede4;  /* 기본 텍스트 (따뜻한 흰색) */

            --bg-image:   url('New%20Images/draw.png'); /* 배경 이미지 — 파일명 변경 가능 */
        }

        /* 1920×1080 고정 캔버스 — 노트북 화면에 맞춰 비율 유지한 채 스케일됨 */
        .canvas {
            width: 1920px;
            height: 1080px;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            overflow: hidden;
            background-color: var(--bg);          /* 이미지 로딩 전 폴백 색상 */
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center center;
            opacity: 0;
            transition: opacity 0.45s ease;
        }
        .canvas.loaded { opacity: 1; }

        /* 실제 콘텐츠 래퍼 — 캔버스 배경 위에 위치 */
        .app {
            position: relative; z-index: 1;
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* 페이드업 애니메이션 — 아래에서 위로 올라오며 나타남 */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ═══════════════════════════════════
           SETUP SECTION: 참여자 등록·추첨 설정
        ═══════════════════════════════════ */
        .setup-section {
            display: none;
            position: absolute;
            top: 0; left: 48%; right: 5%; height: 100%;
            flex-direction: column;
            align-items: flex-start; justify-content: center;
            text-align: left;
            transition: opacity .4s ease; /* 다른 화면으로 넘어갈 때 페이드아웃 */
        }
        .setup-section.visible {
            display: flex;
            animation: fadeUp .7s ease both; /* 화면 진입 시 아래에서 위로 페이드인 */
        }
        .setup-section.leaving { opacity: 0; }

        /* 1) 이어브로우 */
        .setup-eyebrow {
            font-family: 'Pretendard', sans-serif;
            font-weight: 400;
            font-size: 26px;
            letter-spacing: 0.3em;
            text-indent: 0.3em;
            color: #e7cea5;
            margin-bottom: 36px;
        }

        /* 2) 타이틀 */
        .setup-title {
            font-family: 'Noto Serif KR', serif;
            font-weight: 800;
            font-size: 84px;
            line-height: 1.2;
            white-space: nowrap;
            letter-spacing: -0.01em;
            background: linear-gradient(90deg, #fbf3e4 10%, #c9a567 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 34px;
        }

        /* 3) 서브카피 */
        .setup-subcopy {
            font-family: 'Pretendard', sans-serif;
            font-weight: 400;
            font-size: 25px;
            line-height: 1.7;
            color: #ebdbc4;
            margin-bottom: 52px;
        }

        /* 구분선 */
        .setup-divider {
            width: 100%; height: 1px;
            background: rgba(201, 165, 103, .45);
        }

        /* ── 컨트롤 바: 명단 업로드 / 당첨자 수 2단 배치 ── */
        .controls-bar {
            display: flex; align-items: stretch;
            width: 100%; gap: 40px;
            margin: 50px 0 56px;
        }

        .control-col {
            flex: 3; min-width: 0;
            display: flex; flex-direction: column; gap: 36px;
        }
        .control-col--winner { flex: 2; }

        .control-divider {
            width: 1px; align-self: stretch;
            background: rgba(201, 165, 103, .35);
        }

        /* 패널 상단 소형 라벨 */
        .panel-label {
            font-size: 22px; letter-spacing: 1px;
            color: #f0d9ae;
        }

        /* ── 드래그앤드롭 존 ── */
        .drop-zone {
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            user-select: none;
            height: 68px; /* winner-row와 높이 일치 */
        }
        .drop-zone-icon {
            font-size: 30px; line-height: 1; color: #e7cea5; opacity: .9;
            transition: transform .25s;
        }
        .drop-zone:hover .drop-zone-icon,
        .drop-zone.drag-over .drop-zone-icon { transform: translateY(-2px); }
        .drop-zone-main { font-size: 30px; line-height: 1; color: #f0d2a0; font-weight: 500; }
        /* 카운트업 숫자 — winner-input과 동일한 크기(68px), 자릿수만큼 폭을 고정해 뒤따르는 문구가 흔들리지 않게 함 */
        .drop-zone-count { display: inline-block; text-align: right; font-variant-numeric: tabular-nums; font-size: 68px; }
        .drop-zone-sub { font-size: 23px; line-height: 1; color: rgba(242,237,228,.7); margin-top: 6px; }

        /* ── 당첨자 수: − 버튼 / 숫자 입력 / + 버튼 한 줄 배치 ── */
        .winner-row {
            display: flex; align-items: center; gap: 22px;
            height: 68px; /* drop-zone과 높이 일치 */
        }

        /* 당첨자 수 숫자 입력 필드 */
        .winner-input {
            background: transparent; border: none;
            color: #f0d2a0;
            font-family: 'Pretendard', sans-serif;
            font-size: 68px; line-height: 1; font-weight: 500; text-align: center;
            width: 120px; padding: 0; outline: none;
            /* 브라우저 기본 숫자 스피너(화살표) 제거 */
            -moz-appearance: textfield; appearance: textfield;
        }
        .winner-input::-webkit-inner-spin-button,
        .winner-input::-webkit-outer-spin-button { -webkit-appearance: none; appearance: none; }

        /* ± 스텝 버튼 */
        .step-btn {
            background: none; border: none; width: 30px; flex-shrink: 0;
            color: rgba(240,217,174,.6); font-size: 30px; line-height: 1;
            cursor: pointer; user-select: none; /* 더블클릭 시 텍스트 선택 방지 */
            transition: color .2s;
        }
        .step-btn:hover { color: #f0d9ae; }

        /* ── 추첨 시작 버튼 (index.html "경품 추첨 참여하기" 버튼과 동일 스타일) ── */
        .setup-actions {
            display: flex; justify-content: center;
            width: 100%;
            margin-top: 44px;
        }
        .enter-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 26px;
            min-width: 320px;
            padding: 0 42px;
            height: 62px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(180deg, #e8d0a6 0%, #d5b47a 100%);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.18);
            cursor: pointer;
            transition: transform .25s ease, filter .25s ease;
        }
        .enter-btn:hover {
            transform: translateY(-1.5px);
            filter: brightness(1.04);
        }
        .enter-btn-label {
            font-family: 'Pretendard', sans-serif;
            font-weight: 600;
            font-size: 20px;
            color: #3a2c22;
        }
        .enter-btn svg {
            width: 24px; height: 24px;
            color: #3a2c22;
            flex-shrink: 0;
        }

        /* ═══════════════════════════════════
           LOADING SECTION: 추첨 진행 중 화면 (세팅 화면과 동일한 텍스트 컬럼 위치에 카운트다운 표시)
        ═══════════════════════════════════ */
        .loading-section {
            display: none;
            position: absolute;
            top: 0; left: 48%; right: 5%; height: 100%;
            flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center;
            opacity: 0;
            transition: opacity .4s ease;
        }
        .loading-section.visible { display: flex; }
        .loading-section.show { opacity: 1; }

        .loading-label {
            font-family: 'Pretendard', sans-serif;
            font-weight: 400;
            font-size: 22px;
            letter-spacing: 0.3em;
            text-indent: 0.3em;
            color: #e7cea5;
            margin-bottom: 28px;
        }

        /* 한 자리 숫자 카운트다운 — winner-input(참여자 설정의 당첨자 수 숫자)과 동일한 폰트·색상 */
        .loading-count {
            font-family: 'Pretendard', sans-serif;
            font-weight: 500;
            font-size: 200px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            text-align: center;
            color: #f0d2a0;
            margin-bottom: 28px;
            animation: countPop .5s cubic-bezier(.34, 1.4, .64, 1) both;
        }
        @keyframes countPop {
            0%   { opacity: 0; transform: scale(.7); }
            60%  { opacity: 1; transform: scale(1.08); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* display:none 대신 visibility로 숨김 — 박스가 계속 공간을 차지해 버튼이
           사라지고 안내문이 나타나도(또는 그 반대) 위쪽 요소들의 위치가 흔들리지 않음 */
        .loading-sub {
            font-family: 'Pretendard', sans-serif;
            font-size: 20px; color: rgba(242,237,228,.6); letter-spacing: 1px;
            visibility: hidden;
        }

        /* 카운트다운 시작 버튼 — 셋업 화면의 추첨 시작하기(.enter-btn)와 동일 스타일 */
        .loading-section .enter-btn { margin-top: 44px; }
        .loading-section .enter-btn.hidden { visibility: hidden; }

        /* ═══════════════════════════════════
           RESULT SECTION: 당첨자 발표 화면
        ═══════════════════════════════════ */
        .result-section {
            position: relative;
            display: none;
            width: 100%; height: 100%;
            background-image: url('New%20Images/result.png');
            background-size: cover;
            background-position: center center;
            opacity: 0;
            transition: opacity .4s ease;
        }
        .result-section.visible { display: flex; }
        .result-section.show { opacity: 1; }

        /* 스크롤되는 콘텐츠는 배경과 분리된 별도 래퍼에 둔다 —
           같은 요소에 overflow:auto와 배경 이미지를 함께 두면 background-position이
           보이는 영역이 아닌 전체 스크롤 콘텐츠 높이 기준으로 계산되어 배경이 위로 쏠려 보임 */
        .result-inner {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            padding: 90px 40px 40px;
            overflow-y: auto;
        }

        /* 참고 이미지 비율에 맞춘 간격: 상단 텍스트 → 카드 → 버튼 → 하단 오브젝트(선물 상자) */
        .result-header { text-align: center; animation: fadeUp .6s ease both; margin-bottom: 56px; }

        .result-eyebrow {
            font-family: 'Pretendard', sans-serif;
            font-weight: 500;
            font-size: 22px;
            letter-spacing: 0.35em;
            text-indent: 0.35em;
            color: rgba(242, 237, 228, .75);
            margin-bottom: 26px;
        }

        .result-title {
            font-family: 'Noto Serif KR', serif;
            font-weight: 800;
            font-size: 120px;
            letter-spacing: 0.08em;
            line-height: 1.2;
            background: linear-gradient(90deg, #fbf3e4 10%, #c9a567 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 30px;
        }

        .result-divider {
            display: flex; align-items: center; justify-content: center;
            gap: 10px;
        }
        .result-divider-line { width: 60px; height: 1px; background: rgba(201,165,103,.4); }
        .result-divider-gem { font-size: 10px; color: var(--gold); opacity: .75; }

        .winners-grid {
            display: flex; flex-wrap: wrap;
            align-items: flex-start;
            row-gap: 30px; column-gap: 40px;
            justify-content: center;
            max-width: 1800px;
            margin-bottom: 34px;
            perspective: 1800px; /* 카드 전체가 하나의 시점을 공유해야 배치 자체가 입체로 보임 */
            perspective-origin: 50% 30%;
        }

        /* ── 당첨자 티켓 카드 (레퍼런스 재실측: 200:350 비율, 아이보리 종이 + CSS mask 노치) ── */
        .winner-card {
            position: relative;
            width: 200px;
            height: 350px;
            transform-style: preserve-3d; /* 자식(wc-flip)의 뒤집기가 이 카드의 3D 기울기 위에서 그대로 이어지도록 */
            animation: cardIn .6s cubic-bezier(.34,1.3,.64,1) both;
            animation-delay: var(--stagger, 0s);
            /* 진짜 3D 배치: translateZ로 카드를 뒤로 밀어 winners-grid의 perspective가 실제
               원근 축소를 만들고(가짜 scale() 아님), rotateY로 살짝 옆을 보게 돌려 사다리꼴로
               찌그러지게 함(원근감의 핵심). 여기에 얕은 수직 아치(ty)와 평면 기울기(rotateZ) */
            transform:
                translateY(var(--ty, 0px))
                translateZ(var(--tz, 0px))
                rotateY(var(--rotY, 0deg))
                rotateZ(var(--rot, 0deg));
            /* 발광 — mask로 뚫린 노치까지 실루엣을 따라 빛이 새어나오게 하려면
               box-shadow가 아니라 filter:drop-shadow를 써야 함(같은 요소에 mask+box-shadow를
               같이 쓰면 그림자까지 잘려나감). backface-visibility:hidden이 걸린 .wc-face나
               preserve-3d인 .wc-flip에 filter를 두면 크로미움에서 렌더링이 깨지는 경우가 있어,
               3D 컨텍스트 바깥인 .winner-card 자체에 적용 */
            filter:
                drop-shadow(0 -20px 40px rgba(255, 214, 140, .4))
                drop-shadow(0 22px 18px rgba(0, 0, 0, .9))
                drop-shadow(0 40px 50px rgba(0, 0, 0, .6));
        }

        /* 카드 뒤집기 — 기본은 뒷면(물음표)이 보이고, .winners-grid.revealed가 붙으면
           각 카드가 --flip-delay만큼 순서대로 지연되며 180도 회전해 앞면(당첨자 정보)이 드러남 */
        .wc-flip {
            position: absolute; inset: 0;
            transform-style: preserve-3d;
            transition: transform .7s cubic-bezier(.4, .2, .2, 1) var(--flip-delay, 0s);
        }
        .winners-grid.revealed .wc-flip { transform: rotateY(180deg); }

        .wc-face {
            position: absolute; inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .wc-face--front { transform: rotateY(180deg); } /* 뒤집히기 전엔 반대쪽을 향해 숨어있음 */

        /* 카드 본체 — 아이보리 세로 그라데이션 + 좌우 정중앙 반원 노치를 mask로 실제로 뚫음 */
        .wc-shape {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            border-radius: 16px; /* 카드 폭의 8% */
            background: linear-gradient(180deg, #F6F1E6 0%, #E8E0CE 100%);
            -webkit-mask-image:
                radial-gradient(circle 13px at 0% 50%, transparent 99%, #000 100%),
                radial-gradient(circle 13px at 100% 50%, transparent 99%, #000 100%);
            -webkit-mask-composite: intersect, intersect;
            mask-image:
                radial-gradient(circle 13px at 0% 50%, transparent 99%, #000 100%),
                radial-gradient(circle 13px at 100% 50%, transparent 99%, #000 100%);
            mask-composite: intersect, intersect;
        }

        /* 안쪽 금색 프레임 — 45도로 잘린 각진 모서리(cut corner), SVG stroke로 처리
           (clip-path만으로는 잘린 모서리 부분에 테두리 선 자체가 그려지지 않음) */
        .wc-frame {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: block;
            pointer-events: none;
        }

        .wc-content {
            position: absolute; inset: 0;
            padding: 0 18px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }

        /* 라벨은 카드 상단에 고정 배치 — 아래 wc-body가 카드 전체 높이 기준으로 정중앙 정렬되도록 흐름에서 분리 */
        .wc-label {
            position: absolute; top: 28px; left: 18px; right: 18px;
            font-family: 'Pretendard', sans-serif;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 3px;
            color: #b08a54;
        }

        .wc-body {
            display: flex; flex-direction: column; align-items: center;
        }

        .wc-no { font-size: 15px; letter-spacing: 2px; color: #b39158; opacity: .8; margin-bottom: 9px; }
        .wc-hr { width: 20px; height: 1px; background: rgba(163, 128, 63, .4); margin-bottom: 25px; }
        .wc-name { font-size: 30px; font-weight: 700; letter-spacing: 3px; color: #2e2419; margin-bottom: 9px; word-break: keep-all; }
        .wc-aff { font-size: 20px; color: #8a6f3e; margin-bottom: 9px; word-break: keep-all; }
        .wc-empid { font-size: 20px; color: #a89a86; }

        /* 카드 뒷면 (물음표) 장식 */
        .wc-back-mark {
            font-family: 'Pretendard', sans-serif;
            font-weight: 800;
            font-size: 52px;
            color: #c9a567;
            margin-bottom: 12px;
        }
        .wc-back-label {
            font-family: 'Pretendard', sans-serif;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 4px;
            color: #b08a54;
        }

        @keyframes cardIn {
            0%   {
                opacity: 0;
                transform:
                    translateY(calc(var(--ty, 0px) + 30px))
                    translateZ(var(--tz, 0px))
                    rotateY(var(--rotY, 0deg))
                    rotateZ(var(--rot, 0deg))
                    scale(.9);
            }
            100% {
                opacity: 1;
                transform:
                    translateY(var(--ty, 0px))
                    translateZ(var(--tz, 0px))
                    rotateY(var(--rotY, 0deg))
                    rotateZ(var(--rot, 0deg))
                    scale(1);
            }
        }

        /* 화면 우측 하단 액션 버튼 그룹 (다시 추첨 / 당첨 확인 / 수기 추첨 안내 / 홈) */
        .corner-actions {
            position: absolute; bottom: 40px; right: 40px; z-index: 2;
            display: flex; align-items: center; gap: 16px;
        }
        .icon-btn {
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            background: none; padding: 0;
            border: 1px solid rgba(212,175,55,.5); border-radius: 50%;
            color: var(--gold);
            cursor: pointer; outline: none;
            transition: all .3s;
        }
        .icon-btn svg { width: 22px; height: 22px; }
        .icon-btn:hover { background: var(--gold); color: #0a0b0d; }
        .icon-btn.hidden { display: none; }
    </style>
</head>
<body>

<div class="canvas" id="canvas">
<div class="app">

    <!-- ═══ SETUP SECTION: 참여자 등록 + 당첨자 셋팅 ═══ -->
    <section class="setup-section visible" id="setupSection">

        <p class="setup-eyebrow">PARTICIPANT ENTRY</p>
        <h1 class="setup-title">참여자를 등록해 주세요</h1>
        <p class="setup-subcopy">엑셀 명단을 업로드하고 당첨 인원을 설정하세요</p>

        <div class="setup-divider"></div>

        <div class="controls-bar">

            <!-- 명단 업로드 (엑셀 업로드 - 드래그앤드롭) -->
            <div class="control-col">
                <p class="panel-label">명단 업로드</p>
                <div class="drop-zone" id="dropZone">
                    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
                    <div class="drop-zone-icon">⬆</div>
                    <div>
                        <div class="drop-zone-main">참여자 명단을 업로드 하세요</div>
                        <div class="drop-zone-sub">클릭하여 선택 • .xlsx</div>
                    </div>
                </div>
            </div>

            <div class="control-divider"></div>

            <!-- 당첨자 수 -->
            <div class="control-col control-col--winner">
                <p class="panel-label">당첨자 수</p>
                <div class="winner-row">
                    <button class="step-btn" id="btnMinus" aria-label="감소">−</button>
                    <input type="number" class="winner-input" id="winnerCount" value="1" min="1">
                    <button class="step-btn" id="btnPlus" aria-label="증가">+</button>
                </div>
            </div>

        </div>

        <div class="setup-divider"></div>

        <div class="setup-actions">
            <button class="enter-btn" id="drawBtn">
                <span class="enter-btn-label">추첨 시작하기</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M13 6l6 6-6 6" />
                </svg>
            </button>
        </div>

    </section>

    <!-- ═══ LOADING SECTION: 추첨 진행 중 화면 (5·4·3·2·1 카운트다운) ═══ -->
    <section class="loading-section" id="loadingSection">
        <p class="loading-label">DRAWING IN PROGRESS</p>
        <div class="loading-count" id="loadingCount">5</div>
        <p class="loading-sub" id="loadingSub">행운의 주인공을 찾고 있습니다...</p>
        <button class="enter-btn" id="countdownBtn" type="button">
            <span class="enter-btn-label">카운트다운 시작</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
        </button>
    </section>

    <!-- ═══ RESULT SECTION: 당첨자 발표 화면 ═══ -->
    <section class="result-section" id="resultSection">
        <div class="result-inner">
            <div class="result-header">
                <p class="result-eyebrow">WINNERS ANNOUNCED</p>
                <h2 class="result-title">축하합니다</h2>
                <div class="result-divider">
                    <span class="result-divider-line"></span>
                    <span class="result-divider-gem">◆</span>
                    <span class="result-divider-line"></span>
                </div>
            </div>
            <div class="winners-grid" id="winnersGrid"></div>
        </div>
        <div class="corner-actions">
            <button class="icon-btn" id="resetBtn" aria-label="다시 추첨">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
            </button>
            <button class="icon-btn" id="revealBtn" aria-label="당첨 확인">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 6 9 17l-5-5" />
                </svg>
            </button>
            <a class="icon-btn" id="guideBtn" href="guide.html" aria-label="수기 추첨 안내">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M13 6l6 6-6 6" />
                </svg>
            </a>
            <a class="icon-btn" id="homeBtn" href="index.html" aria-label="홈으로">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 11.5L12 4l9 7.5" />
                    <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" />
                </svg>
            </a>
        </div>
    </section>

</div>
</div>

<script>
    /* ═══════════════════════════════════════════════════
       전역 상태
       participants: 등록된 참여자 배열 [{ name, affiliation, employeeId }]
    ═══════════════════════════════════════════════════ */
    let participants = [];

    /* ═══════════════════════════════════════════════════
       파일 입력 이벤트 — 파일 선택 시 parseXlsx 호출
       value를 초기화해 같은 파일을 재업로드할 수 있게 함
    ═══════════════════════════════════════════════════ */
    document.getElementById('fileInput').addEventListener('change', e => {
        if (e.target.files[0]) parseXlsx(e.target.files[0]);
        e.target.value = ''; // 같은 파일 재선택 허용
    });

    /* ═══════════════════════════════════════════════════
       드래그앤드롭 존 이벤트
       - 클릭 시 파일 선택 창 열기
       - 드래그 오버/아웃 시 시각적 피드백
       - 드롭 시 파일 파싱
    ═══════════════════════════════════════════════════ */
    const dropZone = document.getElementById('dropZone');

    dropZone.addEventListener('click', () => document.getElementById('fileInput').click());

    dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', e => {
        if (!dropZone.contains(e.relatedTarget)) dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file) parseXlsx(file);
    });

    /* ═══════════════════════════════════════════════════
       엑셀 파일 파싱 (SheetJS 사용)
       - 첫 번째 시트의 2행부터 읽음 (1행은 헤더로 무시)
       - A열: 이름 / B열: 소속 / C열: 교직원번호
    ═══════════════════════════════════════════════════ */
    function parseXlsx(file) {
        if (typeof XLSX === 'undefined') {
            alert('SheetJS 라이브러리 로드에 실패했습니다.\n인터넷 연결을 확인해주세요.');
            return;
        }

        // 확장자 체크 (.xlsx, .xls, .csv 허용)
        const ext = file.name.split('.').pop().toLowerCase();
        if (!['xlsx', 'xls', 'csv'].includes(ext)) {
            alert('지원하지 않는 파일 형식입니다.\n.xlsx / .xls / .csv 파일을 사용해주세요.');
            return;
        }

        const reader = new FileReader();
        reader.onload = e => {
            try {
                const wb   = XLSX.read(e.target.result, { type: 'array', codepage: 65001 });
                const ws   = wb.Sheets[wb.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

                // 첫 행이 "이름", "name" 등 헤더 키워드면 건너뜀
                const headerKeywords = ['이름', 'name', '성명', '참가자'];
                const firstCell = String(rows[0]?.[0] || '').trim().toLowerCase();
                const skip = headerKeywords.some(k => firstCell.includes(k));
                const dataStart = skip ? 1 : 0;

                if (rows.length === 0 || (skip && rows.length < 2)) {
                    alert('데이터가 없습니다.\nA열: 이름, B열: 소속, C열: 교직원번호 형식으로 작성해주세요.');
                    return;
                }

                const newList = [];
                for (let r = dataStart; r < rows.length; r++) {
                    const name        = String(rows[r][0] || '').trim();
                    const affiliation = String(rows[r][1] || '').trim();
                    const employeeId  = String(rows[r][2] || '').trim();
                    if (!name) continue;
                    newList.push({ name, affiliation, employeeId });
                }

                if (newList.length === 0) {
                    alert('이름 데이터를 찾을 수 없습니다.\nA열에 이름이 있는지 확인해주세요.');
                    return;
                }

                participants = newList;
                animateParticipantCount(document.querySelector('#dropZone .drop-zone-main'), newList.length);
                document.querySelector('#dropZone .drop-zone-sub').style.display = 'none';

            } catch (err) {
                alert('파일 파싱 중 오류가 발생했습니다.\n\n오류 내용: ' + err.message);
                console.error(err);
            }
        };
        reader.onerror = () => alert('파일을 읽는 중 오류가 발생했습니다. 다시 시도해주세요.');
        reader.readAsArrayBuffer(file);
    }

    /* ═══════════════════════════════════════════════════
       등록 인원수 카운트업 애니메이션
       진짜 지수함수 곡선 (e^(K*t)-1)/(e^K-1) 사용 — 다항식과 달리 시작 기울기가
       0이 아니어서 처음부터 조금씩 보이며 올라가다가, 뒤로 갈수록 기울기가
       계속 커져 끊김 없이 확 가속되는 형태
       숫자만 별도 span으로 분리 + 자릿수 폭 고정 → 뒤 문구("명이 등록되었습니다.")가
       숫자 자릿수 변화에 밀려 흔들리는 현상 방지
    ═══════════════════════════════════════════════════ */
    function animateParticipantCount(el, target, duration = 2000) {
        const digits = String(target).length;
        el.innerHTML = `<span class="drop-zone-count" style="min-width:${digits}ch">0</span>명이 등록되었습니다.`;
        const numEl = el.querySelector('.drop-zone-count');

        const K = 6; // 클수록 초반은 더 평평(느림), 막판은 더 가파르게(빠름) 치솟음
        const denom = Math.exp(K) - 1;
        const start = performance.now();
        function step(now) {
            const t = Math.min((now - start) / duration, 1);
            const eased = (Math.exp(K * t) - 1) / denom;
            numEl.textContent = Math.round(eased * target);
            if (t < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }

    // + 버튼: 당첨자 수 1 증가
    document.getElementById('btnPlus').addEventListener('click', () => {
        const el = document.getElementById('winnerCount');
        el.value = Math.max(1, (parseInt(el.value) || 0) + 1);
    });
    // − 버튼: 당첨자 수 1 감소 (최솟값 1)
    document.getElementById('btnMinus').addEventListener('click', () => {
        const el = document.getElementById('winnerCount');
        el.value = Math.max(1, (parseInt(el.value) || 2) - 1);
    });

    /* ═══════════════════════════════════════════════════
       Fisher-Yates 셔플 — 배열을 무작위 순서로 섞어 반환
       (원본 배열은 변경하지 않음)
    ═══════════════════════════════════════════════════ */
    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    /* ═══════════════════════════════════════════════════
       XSS 방지 — 사용자 데이터를 HTML에 삽입하기 전에 이스케이프
    ═══════════════════════════════════════════════════ */
    function safe(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }

    /* ═══════════════════════════════════════════════════
       화면 전환 헬퍼 — opacity 트랜지션으로 부드럽게 교차 전환
       fadeOutSection: 대상에 'leaving' 부여 → 트랜지션 종료 후 숨김 콜백
       fadeInSection : 'visible'로 표시(display) → 다음 프레임에 'show' 부여해 opacity 전환 트리거
    ═══════════════════════════════════════════════════ */
    const SECTION_FADE_MS = 400;

    function fadeOutSection(el, onDone) {
        el.classList.add('leaving');
        setTimeout(() => {
            el.classList.remove('visible', 'leaving', 'show');
            if (onDone) onDone();
        }, SECTION_FADE_MS);
    }

    function fadeInSection(el) {
        el.classList.add('visible');
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                el.classList.add('show');
            });
        });
    }

    /* countPop 애니메이션을 강제로 재시작 — 매초 숫자가 바뀔 때마다 팝 효과가 다시 재생되도록 함 */
    function restartCountPop(el) {
        el.style.animation = 'none';
        void el.offsetWidth; // 리플로우 강제
        el.style.animation = '';
    }

    /* 한 자리 숫자로 5→1 카운트다운 — 매초 감소, 1까지 보여준 뒤 onDone 호출 */
    function startCountdown(from, onDone) {
        const countEl = document.getElementById('loadingCount');
        let count = from;
        countEl.textContent = count;
        restartCountPop(countEl);

        const timer = setInterval(() => {
            count--;
            if (count > 0) {
                countEl.textContent = count;
                restartCountPop(countEl);
            } else {
                clearInterval(timer);
                onDone();
            }
        }, 1000);
    }

    /* ═══════════════════════════════════════════════════
       추첨 실행
       1. 유효성 검사 (참여자 없음, 인원 수 오류 등)
       2. 셋업 화면 페이드아웃 → 로딩 화면 페이드인
       3. 카운트다운 후 로딩 화면 페이드아웃 → 당첨자 발표 화면 페이드인
    ═══════════════════════════════════════════════════ */
    function runDraw() {
        if (participants.length === 0) {
            alert('참여자를 등록해 주세요.');
            return;
        }

        const winnerCount = parseInt(document.getElementById('winnerCount').value, 10);

        if (!Number.isInteger(winnerCount) || winnerCount < 1) {
            alert('당첨 인원은 1명 이상이어야 합니다.');
            return;
        }

        if (winnerCount > participants.length) {
            alert(
                `당첨 인원(${winnerCount}명)이 참가자 수(${participants.length}명)보다 많습니다.\n` +
                `당첨 인원을 줄이거나 참가자를 추가해 주세요.`
            );
            return;
        }

        const winners = shuffle(participants).slice(0, winnerCount);

        const setupSection = document.getElementById('setupSection');
        const loadingSection = document.getElementById('loadingSection');
        const countdownBtn = document.getElementById('countdownBtn');
        const loadingSub = document.getElementById('loadingSub');

        fadeOutSection(setupSection, () => {
            // 재추첨 대비 초기 상태로 리셋 (버튼 표시, 안내문 숨김, 숫자 5로)
            document.getElementById('loadingCount').textContent = 5;
            countdownBtn.classList.remove('hidden');
            loadingSub.style.visibility = 'hidden';

            fadeInSection(loadingSection);

            // "카운트다운 시작" 버튼을 눌러야 그때부터 카운트다운이 시작됨
            countdownBtn.addEventListener('click', function onCountdownStart() {
                countdownBtn.classList.add('hidden');
                loadingSub.style.visibility = 'visible';

                startCountdown(5, () => {
                    fadeOutSection(loadingSection, () => {
                        showWinners(winners);
                        fadeInSection(document.getElementById('resultSection'));
                    });
                });
            }, { once: true });
        });
    }

    /* ═══════════════════════════════════════════════════
       당첨자 티켓 카드 — 스펙 기준 상수 (카드 200×350, 레퍼런스 재실측 반영)
       - 카드 본체 노치/모서리는 CSS(.wc-shape)의 border-radius + mask로 처리
       - 안쪽 금색 프레임(45도 컷 코너)만 SVG stroke로 그림
    ═══════════════════════════════════════════════════ */
    const WC_FRAME_PATH = 'M24,14 L176,14 L186,24 L186,326 L176,336 L24,336 L14,326 L14,24 Z';

    /* 배치: 얕은 수직 아치 + 진짜 3D 원근감(translateZ+rotateY, winners-grid의 공유 perspective가
       실제 축소/사다리꼴 왜곡을 만듦) + 끝 카드만 평면상 살짝 회전(rotateZ)
       — 카드 수와 무관하게, 가장 바깥쪽 카드가 항상 최대값에 도달하도록
         현재 세트의 최대 offset 기준으로 정규화 */
    const WC_FAN_ROT_MAX  = 0.8;  // deg, 가장 바깥쪽 카드의 평면 기울기(rotateZ)
    const WC_FAN_DROP_MAX = 10;   // px, 가장 바깥쪽 카드가 중앙보다 내려가는 정도(translateY)
    const WC_FAN_ROTY_MAX = 5;   // deg, 가장 바깥쪽 카드가 옆을 보도록 돌아가는 각도(rotateY)
    const WC_FAN_TZ_MAX   = 20;   // px, 가장 바깥쪽 카드가 뒤로 밀려나는 깊이(translateZ, 음수)

    function wcFrameSvg() {
        return `<svg class="wc-frame" viewBox="0 0 200 350">`
            + `<path d="${WC_FRAME_PATH}" fill="none" stroke="#C9A96A" stroke-opacity="0.7" stroke-width="1"/>`
            + `</svg>`;
    }

    function wcCardFace(innerHtml) {
        return `<div class="wc-shape"></div>${wcFrameSvg()}`
            + `<div class="wc-content">${innerHtml}</div>`;
    }

    /* ═══════════════════════════════════════════════════
       당첨자 카드 렌더링 — 카드가 순서대로 튀어오르며 등장
       각 카드는 뒷면(물음표)이 앞을 향한 채로 시작하고, "당첨 확인" 클릭 시
       revealWinners()가 순차적으로 뒤집어 앞면(당첨자 정보)을 드러냄
    ═══════════════════════════════════════════════════ */
    function showWinners(winners) {
        const grid = document.getElementById('winnersGrid');
        grid.innerHTML = '';
        grid.classList.remove('revealed');
        const maxOffset = (winners.length - 1) / 2;
        winners.forEach((w, i) => {
            const card = document.createElement('div');
            card.className = 'winner-card';
            const offset = i - maxOffset; // 중앙 카드 기준 상대 위치 (음수: 왼쪽)
            const norm = maxOffset > 0 ? offset / maxOffset : 0; // -1..1, 가장 바깥쪽이 ±1
            card.style.setProperty('--stagger', `${Math.min(i * 0.09, 2)}s`);
            card.style.setProperty('--rot', `${(norm * WC_FAN_ROT_MAX).toFixed(2)}deg`);
            card.style.setProperty('--ty', `${(norm * norm * WC_FAN_DROP_MAX).toFixed(1)}px`);
            // rotateY: 양수면 오른쪽이, 음수면 왼쪽이 뒤로 물러남 → norm 부호를 그대로 써서
            // 바깥쪽 카드의 "바깥쪽 모서리"가 항상 뒤로 물러나는 부채꼴 형태가 되도록 함
            card.style.setProperty('--rotY', `${(norm * WC_FAN_ROTY_MAX).toFixed(2)}deg`);
            card.style.setProperty('--tz', `${(-norm * norm * WC_FAN_TZ_MAX).toFixed(1)}px`);
            card.style.setProperty('--flip-delay', `${Math.min(i * 0.15, 2)}s`);

            const backInner =
                `<div class="wc-back-mark">?</div>`
                + `<div class="wc-back-label">LUCKY DRAW</div>`;
            const frontInner =
                `<div class="wc-label">+ WINNER +</div>`
                + `<div class="wc-body">`
                +     `<div class="wc-no">No.${String(i + 1).padStart(2, '0')}</div>`
                +     `<div class="wc-hr"></div>`
                +     (w.affiliation ? `<div class="wc-aff">${safe(w.affiliation)}</div>` : '')
                +     `<div class="wc-name">${safe(w.name)}</div>`
                +     (w.employeeId ? `<div class="wc-empid">(${safe(w.employeeId)})</div>` : '')
                + `</div>`;

            card.innerHTML =
                `<div class="wc-flip">`
                +   `<div class="wc-face wc-face--back">${wcCardFace(backInner)}</div>`
                +   `<div class="wc-face wc-face--front">${wcCardFace(frontInner)}</div>`
                + `</div>`;
            grid.appendChild(card);
        });

        const revealBtn = document.getElementById('revealBtn');
        revealBtn.disabled = false;
        revealBtn.classList.remove('hidden');

        document.getElementById('resultSection').classList.add('visible');
    }

    /* ═══════════════════════════════════════════════════
       당첨 확인 — 카드를 순차적으로 뒤집어 당첨자를 공개
    ═══════════════════════════════════════════════════ */
    function revealWinners() {
        const revealBtn = document.getElementById('revealBtn');
        revealBtn.disabled = true;
        revealBtn.classList.add('hidden');
        document.getElementById('winnersGrid').classList.add('revealed');
    }

    /* ═══════════════════════════════════════════════════
       다시 추첨 — 결과 화면을 숨기고 셋업 화면으로 복귀
       참여자 명부는 유지되어 바로 재추첨 가능
    ═══════════════════════════════════════════════════ */
    function resetDraw() {
        fadeOutSection(document.getElementById('resultSection'), () => {
            document.getElementById('winnersGrid').innerHTML = '';
            fadeInSection(document.getElementById('setupSection'));
        });
    }

    document.getElementById('drawBtn').addEventListener('click', runDraw);
    document.getElementById('revealBtn').addEventListener('click', revealWinners);
    document.getElementById('resetBtn').addEventListener('click', resetDraw);

    /* ═══════════════════════════════════════════════════
       [개발용] F9 — 참여자 등록/카운트다운 없이 더미 당첨자 6명으로
       결과 화면(카드 배치)을 바로 확인. 실제 participants 상태는 건드리지 않음
    ═══════════════════════════════════════════════════ */
    const DEBUG_MOCK_WINNERS = [
        { name: '홍길동', affiliation: '교무과', employeeId: '10231' },
        { name: '김민준', affiliation: '학생과', employeeId: '10456' },
        { name: '이서연', affiliation: '총무과', employeeId: '10789' },
        { name: '박도윤', affiliation: '기획처', employeeId: '11023' },
        { name: '최지우', affiliation: '입학처', employeeId: '11345' },
        { name: '정하은', affiliation: '교무과', employeeId: '11678' },
    ];
    document.addEventListener('keydown', e => {
        if (e.key !== 'F9') return;
        e.preventDefault();
        document.querySelectorAll('.setup-section, .loading-section, .result-section')
            .forEach(el => el.classList.remove('visible', 'show', 'leaving'));
        showWinners(DEBUG_MOCK_WINNERS);
        fadeInSection(document.getElementById('resultSection'));
    });

    /* ═══════════════════════════════════════════════════
       1920×1080 캔버스를 뷰포트에 맞춰 비율 유지한 채 스케일
    ═══════════════════════════════════════════════════ */
    function fitCanvas() {
        var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var offsetX = (window.innerWidth - 1920 * scale) / 2;
        var offsetY = (window.innerHeight - 1080 * scale) / 2;
        var canvas = document.getElementById('canvas');
        canvas.style.transform =
            'translate(' + offsetX + 'px, ' + offsetY + 'px) scale(' + scale + ')';
    }
    fitCanvas();
    window.addEventListener('resize', fitCanvas);

    // 페이지 진입 시 부드럽게 페이드인 (index.html에서의 전환과 이어지도록)
    window.addEventListener('load', function () {
        requestAnimationFrame(function () {
            document.getElementById('canvas').classList.add('loaded');
        });
    });
</script>

</body>
</html>
