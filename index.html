<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dong-A LUCKY DRAW</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
      rel="stylesheet"
    />

    <!-- 최신 Chromium(126+)에서 페이지 간 이동 시 브라우저 네이티브 크로스페이드 전환 -->
    <style>
      @view-transition {
        navigation: auto;
      }
    </style>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0a0b0f;
      }

      /* 1920×1080 고정 캔버스 — 노트북 화면에 맞춰 비율 유지한 채 스케일됨 */
      .canvas {
        width: 1920px;
        height: 1080px;
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: top left;
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.45s ease;
      }
      .canvas.loaded { opacity: 1; }
      .canvas.leaving { opacity: 0; }

      .bg-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        object-fit: cover;
        object-position: center bottom;
        pointer-events: none;
      }

      /* ── 우측 텍스트 패널 ── */
      .panel {
        position: absolute;
        top: 0;
        left: 50%;
        right: 6.5%;
        height: 100%;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      /* 1) 이어브로우 */
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 22px;
        margin-bottom: 52px;
      }

      .eyebrow-line {
        width: 56px;
        height: 2px;
        background: rgba(201, 165, 103, 0.7);
      }

      .eyebrow-text {
        font-family: 'Pretendard', sans-serif;
        font-weight: 400;
        font-size: 24px;
        color: #e5c79c;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        white-space: nowrap;
      }

      /* 2) 타이틀 */
      .title-wrap {
        filter: drop-shadow(0 0 26px rgba(226, 194, 136, 0.32));
        margin-bottom: 48px;
      }

      .title {
        font-family: 'Noto Serif KR', serif;
        font-weight: 800;
        font-size: 100px;
        line-height: 1.25;
        letter-spacing: -0.01em;
        text-align: center;
        background: linear-gradient(135deg, #fbf3e4 10%, #c9a567 90%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* 3) 디바이더 */
      .divider {
        width: 120px;
        height: 2px;
        background: rgba(201, 165, 103, 0.65);
        margin-bottom: 46px;
      }

      /* 4) 서브카피 */
      .subcopy {
        font-family: 'Pretendard', sans-serif;
        font-weight: 400;
        font-size: 24px;
        line-height: 1.8;
        color: #d3c3a9;
        text-align: center;
        margin-bottom: 60px;
      }

      /* 5) 버튼 */
      .enter-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 26px;
        width: 392px;
        height: 62px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(180deg, #e8d0a6 0%, #d5b47a 100%);
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.18);
        text-decoration: none;
        cursor: pointer;
        transition:
          transform 0.25s ease,
          filter 0.25s ease;
      }

      .enter-btn:hover {
        transform: translateY(-1.5px);
        filter: brightness(1.04);
      }

      .enter-btn-label {
        font-family: 'Pretendard', sans-serif;
        font-weight: 600;
        font-size: 20px;
        color: #3a2c22;
      }

      .enter-btn svg {
        width: 24px;
        height: 24px;
        color: #3a2c22;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="canvas" id="canvas">
      <video
        class="bg-image"
        src="New%20Images/Lucky Draw.mp4"
        poster="New%20Images/main.png"
        autoplay
        muted
        loop
        playsinline
      ></video>

      <div class="panel">
        <div class="eyebrow">
          <span class="eyebrow-line"></span>
          <span class="eyebrow-text">LUCKY DRAW EVENT</span>
          <span class="eyebrow-line"></span>
        </div>

        <div class="title-wrap">
          <h1 class="title">
            함께 이룬 성과,<br />
            함께 여는 미래
          </h1>
        </div>

        <div class="divider"></div>

        <p class="subcopy">
          지금 행운의 주인공이 되어보세요!
        </p>

        <a class="enter-btn" href="draw.html">
          <span class="enter-btn-label">경품 추첨 참여하기</span>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </a>
      </div>
    </div>

    <script>
      function fitCanvas() {
        var scale = Math.min(
          window.innerWidth / 1920,
          window.innerHeight / 1080,
        );
        var offsetX = (window.innerWidth - 1920 * scale) / 2;
        var offsetY = (window.innerHeight - 1080 * scale) / 2;
        var canvas = document.getElementById('canvas');
        canvas.style.transform =
          'translate(' +
          offsetX +
          'px, ' +
          offsetY +
          'px) scale(' +
          scale +
          ')';
      }
      fitCanvas();
      window.addEventListener('resize', fitCanvas);

      // 페이지 진입 시 부드럽게 페이드인
      var canvasEl = document.getElementById('canvas');
      window.addEventListener('load', function () {
        requestAnimationFrame(function () {
          canvasEl.classList.add('loaded');
        });
      });

      // draw.html로 이동하기 전 페이드아웃 후 전환 (View Transitions 미지원 브라우저 대응)
      document.querySelector('.enter-btn').addEventListener('click', function (e) {
        var href = this.getAttribute('href');
        if (!href) return;
        e.preventDefault();
        canvasEl.classList.remove('loaded');
        canvasEl.classList.add('leaving');
        setTimeout(function () {
          window.location.href = href;
        }, 420);
      });
    </script>
  </body>
</html>
